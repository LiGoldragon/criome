[package]
name         = "criome"
version      = "0.9.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/criome"
description  = "Spartan BLS-signature authentication and attestation daemon for the Persona ecosystem."

[lib]
name = "criome"
path = "src/lib.rs"

[[bin]]
name = "criome"
path = "src/main.rs"
required-features = ["dotos-text"]

[[bin]]
name = "criome-daemon"
path = "src/bin/criome-daemon.rs"

[[bin]]
name = "criome-encode-configuration"
path = "src/bin/criome-encode-configuration.rs"
required-features = ["dotos-text"]

[[bin]]
# The owner-only cross-node founding operator CLI: observe a node's public key,
# initiate a founding, observe the pending-founding queue, and accept by anchor.
name = "criome-founding"
path = "src/bin/criome-founding.rs"
required-features = ["dotos-text"]

[[bin]]
name = "criome-cluster-witness-test"
path = "src/bin/criome-cluster-witness-test.rs"
required-features = ["cluster-witness"]

[[bin]]
name = "criome-write-configuration"
path = "src/bin/criome-write-configuration.rs"
required-features = ["cluster-witness"]

[[bin]]
name = "criome-auto-approve-witness-test"
path = "src/bin/criome-auto-approve-witness-test.rs"
required-features = ["cluster-witness"]

[[bin]]
name = "criome-client-approval-witness-test"
path = "src/bin/criome-client-approval-witness-test.rs"
required-features = ["cluster-witness"]

[features]
default = []
dotos-text = ["dep:dotos", "signal-criome/dotos-text", "meta-signal-criome/dotos-text", "signal-frame/dotos-text"]
# The criome-cluster test harness binaries (the authorization witness and its
# daemon-config encoder) — designer report 704, Stage A. Excluded from
# production builds; the NixOS cluster test enables it.
cluster-witness = []

[dependencies]
blake3       = "1"
blst         = "0.3"
kameo        = { git = "https://github.com/LiGoldragon/kameo.git", rev = "f491b45d7dcb55e5837eddde3d5d7ca8ceaa9f01", default-features = false, features = ["macros", "tracing"] }
dotos   = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "b3c2c76fe7a18ba026ab054d1fa7162e55860b9e", optional = true }
meta-signal-criome = { git = "https://github.com/LiGoldragon/meta-signal-criome.git", rev = "5acfedafd63964da1a4d1082245f3943c6d371b5" }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
rustix       = { version = "1", features = ["net"] }
sema-engine  = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "27e814a721439af67721c530d48b4d2101141f74" }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "80f70d929ae6d72707052f097be2264872913983" }
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome.git", rev = "b85fe3408faa24b8439a3685396430a68bfbcb71" }
signal-router = { git = "https://github.com/LiGoldragon/signal-router.git", rev = "03ed6bc2217d6a8d0ed5e1291e417ea4d4de168f" }
thiserror    = "2"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "7d10bb9d9a08ce363a0be8cff2716103f0a326fe" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", rev = "f491b45d7dcb55e5837eddde3d5d7ca8ceaa9f01" }
